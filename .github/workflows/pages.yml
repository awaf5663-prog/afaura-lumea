# Publication du site sur GitHub Pages.
#
# Rien à activer à la main : `enablement: true` allume GitHub Pages au premier
# passage. Ensuite, chaque envoi sur la branche republie le site.
#
# La clé Supabase est écrite en clair ici volontairement : c'est la clé
# PUBLIQUE du projet. Elle part de toute façon dans le JavaScript du site, que
# le dépôt soit public ou non — ce qui protège les données, ce sont les règles
# RLS de supabase/schema.sql. La clé « service_role » n'a rien à faire ici.
name: Publier le site

on:
  push:
    branches:
      - claude/senegal-ecommerce-shein-b1aqs2
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois ; on laisse finir celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le site vit désormais à la racine du domaine afauralumea.shop, et non
      # plus dans le sous-dossier /afaura-lumea/. Le chemin de base doit suivre :
      # sinon la page demande ses fichiers à une adresse qui n'existe pas, et
      # s'affiche entièrement vide.
      # ── BOUTIQUE EN PAUSE ──
      #
      # « oui » remplace toute la boutique par un écran qui dit qu'elle
      # revient, avec le bouton WhatsApp : la boutique continue donc de
      # vendre par message. L'espace d'administration reste ouvert.
      #
      # Le réglage vit ICI et non dans la base : on met le site en pause
      # précisément les jours où la base ne répond pas.
      #
      # POUR ROUVRIR LA BOUTIQUE : remettre « non » et republier.
      #
      # ── OÙ LE SITE PREND SES DONNÉES ──
      #
      # Tant que VITE_WORKER_URL est vide, le site continue de lire
      # Supabase, exactement comme avant : renseigner l'adresse du Worker
      # est ce qui bascule la boutique sur Cloudflare, et l'effacer est ce
      # qui la ramène en arrière. Rien d'autre à changer, et surtout rien
      # à changer dans le code.
      #
      # L'adresse se met dans Settings → Secrets and variables → Actions →
      # onglet Variables, sous le nom WORKER_URL. Ce n'est pas un secret :
      # elle part de toute façon dans le JavaScript du site. Ce qui protège
      # les données, c'est que le Worker exige le mot de passe pour tout ce
      # qui est réservé (voir cloudflare/src/acces.ts).
      - name: Dire d'où viendront les données
        run: |
          if [ -n "${{ vars.WORKER_URL }}" ]; then
            echo "Source : le Worker Cloudflare (${{ vars.WORKER_URL }})."
          else
            echo "Source : Supabase. La variable WORKER_URL n'est pas renseignée."
          fi

      - name: Construire le site
        env:
          VITE_BOUTIQUE_EN_PAUSE: oui
          VITE_BASE_PATH: /
          VITE_SITE_URL: https://afauralumea.shop
          VITE_WORKER_URL: ${{ vars.WORKER_URL }}
          VITE_SUPABASE_URL: https://mhutsbfnzoiuqsoxkdji.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_lMzrL8g6JkaE0jWdabLD-Q_-8TQ5i9h
        run: npm run build

      # GitHub Pages renvoie une 404 pour toute adresse qui n'est pas un
      # fichier. Servir index.html à sa place laisse le routeur du site faire
      # son travail : sans ça, ouvrir /boutique directement échouerait.
      - run: cp dist/index.html dist/404.html

      # `enablement` allume Pages si ce n'est pas déjà fait, au lieu d'échouer
      # avec « Get Pages site failed » et d'obliger à cliquer dans les réglages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
