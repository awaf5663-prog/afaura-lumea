<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fcf7fa" />

    <title>Espace AFAURA — Voiles, Beauté & Commandes Groupées SHEIN & ALIBABA</title>
    <meta
      name="description"
      content="Catalogue officiel Espace AFAURA : voiles d'exception, soies de Médine, jerseys frisés, abayas, soins, parfums et service de commande groupée SHEIN & ALIBABA à Saint-Louis, Dakar, Thiès et Louga."
    />
    <meta name="robots" content="index,follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Espace AFAURA" />
    <meta property="og:title" content="Espace AFAURA — Voiles, Beauté & Commandes Groupées SHEIN & ALIBABA" />
    <meta
      property="og:description"
      content="Catalogue officiel Espace AFAURA. Voiles de prestige, soies d'exception, tarifs grossistes et commandes groupées SHEIN & ALIBABA à Saint-Louis, Dakar, Thiès et Louga."
    />
    <meta property="og:locale" content="fr_SN" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      L'icône de la boutique, dans l'onglet. Le lettrage de la pastille n'est
      plus lisible à 32 px : c'est sa couleur qui la fait reconnaître parmi
      dix onglets ouverts, et c'est déjà beaucoup.
    -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!--
      Icône de l'écran d'accueil. iPhone ne sait pas se servir d'un SVG ici :
      sans ce PNG, l'icône installée serait une capture grise de la page.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Le site s'installe depuis le navigateur, sans passer par un store :
      « Ajouter à l'écran d'accueil » pose l'icône Afaura Luméa à côté des
      autres applications, et le site s'ouvre en plein écran.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Afaura Luméa" />
    <meta name="application-name" content="Afaura Luméa" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Les polices se chargent SANS bloquer l'affichage.

      Une feuille de style classique arrête le rendu tant qu'elle n'est pas
      arrivée : deux allers-retours réseau avant qu'une cliente voie quoi que
      ce soit, ce qui se compte en demi-secondes sur un téléphone en 4G. Le
      « media=print » fait passer celle-ci pour une feuille d'impression —
      donc sans importance pour l'écran — puis on la réactive une fois reçue.
      La page s'affiche tout de suite avec les polices du téléphone, et
      Fraunces et Inter prennent le relais en arrivant.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
