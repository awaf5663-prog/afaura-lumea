# ═══════════════════════════════════════════════════════════════════════
#  LE WORKER : la seule porte vers les données de la boutique
# ═══════════════════════════════════════════════════════════════════════
#
#  Ce fichier ne contient AUCUN SECRET, et n'en contiendra jamais.
#
#  L'identifiant de compte et celui de la base ne sont pas des secrets :
#  ils désignent, ils n'ouvrent rien. Ce qui ouvre — le jeton d'API
#  Cloudflare, le mot de passe de l'administration, le jeton du robot
#  Telegram — vit dans les secrets du dépôt GitHub et dans les secrets du
#  Worker, jamais ici, jamais dans le dépôt.

name = "afaura-lumea-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
account_id = "70d1b4a84fbb48c3532402cd9e405fb9"

# ── La base de données ─────────────────────────────────────────────────
#  Créée le 23 septembre 2026 par le workflow de mise en place, région
#  ENAM. L'identifiant n'est pas un secret : il désigne la base, il ne
#  l'ouvre pas — c'est le jeton d'API qui ouvre, et il vit dans les
#  secrets du dépôt.
[[d1_databases]]
binding = "DB"
database_name = "afaura-lumea"
database_id = "e1d8a40c-8d8b-4d5c-b406-99b2b7bcb110"

# ── Le stockage des photos — PAS ENCORE ACTIVÉ ─────────────────────────
#
#  R2 demande d'être activé une fois à la main dans le tableau de bord, et
#  d'y enregistrer un moyen de paiement — même si l'usage reste gratuit :
#  toutes les images du site réunies pèsent 19 Mo, soit 0,19 % des 10 Go
#  offerts. La boutique verra ça plus tard.
#
#  RIEN N'ATTEND R2 EN ATTENDANT, et c'est volontaire. Le Worker doit
#  fonctionner sans : les photos livrées avec le site viennent du dépôt et
#  ne coûtent rien. R2 ne sert qu'à UNE chose — que la boutique téléverse
#  une photo elle-même, sans passer par un envoi. Tant qu'il n'est pas là,
#  le Worker répond clairement que ce n'est pas disponible plutôt que
#  d'échouer sans expliquer.
#
#  POUR L'ACTIVER PLUS TARD : enlever les dièses ci-dessous, puis relancer
#  le workflow « Cloudflare — mise en place » avec activer_r2 = oui.
#
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "afaura-lumea-photos"

[observability]
enabled = true
